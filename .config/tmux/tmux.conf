# ~/.config/tmux/tmux.conf

# --- XON/XOFF (software flow control) ---------------------------------------
# Flow control is a property of the pty, not of tmux itself. On this setup it
# is disabled in two places:
#
#   1. tmux puts the *client* terminal into raw mode while attached, which
#      clears IXON, so the outer terminal no longer turns Ctrl-S into XOFF.
#   2. Every pane runs an interactive bash, and ~/.bashrc runs `stty -ixon`
#      on the pane's pty.
#
# The unbinds below make the intent explicit: Ctrl-S / Ctrl-Q are never
# grabbed by tmux, so they always reach the pane (and readline).
unbind -n C-s
unbind -n C-q
