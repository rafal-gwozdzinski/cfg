# ~/.config/tmux/tmux.conf

# --- XON/XOFF (software flow control) ---------------------------------------
# Flow control is a property of the pty, not of tmux itself. On this setup it
# is disabled in two places:
#
#   1. tmux puts the *client* terminal into raw mode while attached, which
#      clears IXON, so the outer terminal no longer turns Ctrl-S into XOFF.
#   2. Every pane runs an interactive bash, and ~/.bashrc runs `stty -ixon`
#      on the pane's pty.
#
# The unbinds below make the intent explicit: Ctrl-S / Ctrl-Q are never
# grabbed by tmux, so they always reach the pane (and readline).
unbind -n C-s
unbind -n C-q

# --- vi mode ---------------------------------------------------------------
setw -g mode-keys vi
set -g status-keys vi

# Explicit copy-mode-vi bindings (these are the defaults; kept for clarity).
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# --- terminal / clipboard --------------------------------------------------
# Works on macOS and in the Ubuntu VM; OSC 52 reaches Ghostty or tmux client.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on

# --- quality of life -------------------------------------------------------
set -g history-limit 50000
set -sg escape-time 10
